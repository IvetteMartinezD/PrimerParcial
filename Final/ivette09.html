    <script>
      const API_HP = 'https://hp-api.onrender.com/api/characters'; 
       const API_RICK = 'https://rickandmortyapi.com/api/character';
       
       const main = document.getElementById('main');
       const form = document.getElementById('form');
       const search = document.getElementById('search');

       getAllCharacters();//Se llama a la función que obtiene todos los personajes de ambas APIs cuando la página carga por primera vez
       //Se llama a la función que obtiene todos los personajes de ambas APIs cuando la página carga por primera vez
       async function getAllCharacters(){
        const [resRM, resHP] = await Promise.all([
        fetch(API_RICK).then(res => res.json()), 
        fetch(API_HP).then(res => res.json())
    ]);

            //La función es async, porque va a usar await.
            //Se muestra un mensaje mientras cargan los personajes.
            //Se hacen ambas peticiones en paralelo con Promise.all.
            //Se convierten las respuestas en formato JSON.
            //await hace que JavaScript espere el resultado de Promise.all(..)antes de continuar con el resto del código, 
            // Es decir, detiene la ejecución hasta que ambas respuestas esten listas.

              const rm = resRM.results || [];//personajes de rick
              const hp = resHP || [];//personajes de HP
            //se guardan los arrays de los personajes 
            //Rick and Morty usa results, Harry Potter devuelve un array directamente.

        showCharacters([...rm, ...hp]);
       }
       //se llama a showcharacters para mostrar todos los personajes juntos.
      function showCharacters(characters){
        main.innerHTML = '';

        characters.forEach((char) => {//es el que comparten
       let name = char.name || 'Desconocida';
       let image = char.image || '';
       let species = char.species || 'Desconocida';
       let gender = char.gender || 'Desconocida';
    

       const charElement = document.createElement('div');
       charElement.classList.add ('personaje');
      // Si el personaje tiene "status", es de Rick and Morty,pq este si pertenece en el API
      if (char.status) {
      let id = char.id;//campos de rick
      let status = char.status;

      charElement.innerHTML = `
        <img src="${image}" alt="${name}">
        <div class="personaje-info">
            <h1>${id}</h1>
            <h3>${name}</h3>
            <br>
        </div>
        <div class="overview">
            <h3>Descripción</h3>
            <p><strong>Especie:</strong> ${species}</p>
            <p><strong>Género:</strong> ${gender}</p>
            <p><strong>Estado:</strong> ${status}</p>
        </div>
      `;
    } else { // Si no tiene "status", es de HP,ahí es cuando se ejecuta else pq se seria un personaje de HP
      const { house, patronus, yearOfBirth, ancestry } = char;
      

      charElement.innerHTML = `
        <img src="${image}" alt="${name}">
        <div class="personaje-info">
            <h3>${name}</h3>

        </div>
        <div class="overview">
            <h3>Descripción</h3>
            <p><strong>Especie:</strong> ${species}</p>
            <p><strong>Patronus:</strong> ${patronus || 'No'}</p>
            <p><strong>Género:</strong> ${gender}</p>
            <p><strong>Año de nacimiento:</strong> ${yearOfBirth || 'Desconocido'}</p>
            <p><strong>Linaje:</strong> ${ancestry || 'Desconocido'}</p>
             <p><strong>Casa:</strong> ${house || 'Desconocido'}</p>

        </div>
      `;
    }

    main.appendChild(charElement);
  });
}
  form.addEventListener('submit', (e) =>{ //no funciona buscador
          e.preventDefault()
          const searchTerm = search.value.toLowerCase();
          if(searchTerm && searchTerm !== ''){
            getCharacters(API_RICK + `/?name=${searchTerm}`);
            search.value='';
          }else{window.location.reload();}
        });
